openapi: 3.0.3

info:
  title: iSign Attendance Platform - Authentication API
  version: 1.0.0
  description: API documentation for the authentication module of the iSign Attendance Platform.

servers:
  - url: https://api.example.com
    description: Example API server

tags:
  - name: Authentication
    description: Authentication, token refresh, logout, and current-user endpoints.

paths:

  /api/v1/auth/login:
    post:
      operationId: loginUser
      tags:
        - Authentication
      summary: Login user
      description: >
        Authenticates a user using their username and password.
        On successful login, the backend returns an access token in the JSON response
        and sets a refresh_token HttpOnly cookie.
        The refresh token is never returned in the response body.

      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: Password123

      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              description: >
                Sets the refresh_token HttpOnly cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessResponse"

        "400":
          description: Username or password is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                success: false
                code: INVALID_CREDENTIALS
                message: Invalid username or password

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericErrorResponse"

  /api/v1/auth/refresh:
    post:
      operationId: refreshAccessToken
      tags:
        - Authentication
      summary: Refresh access token
      description: >
        Validates the refresh token stored in the refresh_token HttpOnly cookie,
        verifies the related refresh session, enforces idle and absolute session timeouts,
        rotates the refresh token, creates a new refresh session,
        revokes the previous session, and returns a new access token.
        On security-related refresh failures, the backend may clear the refresh-token cookie.

      security:
        - refreshCookie: []

      responses:
        "200":
          description: New access token generated successfully
          headers:
            Set-Cookie:
              description: >
                Replaces the current refresh_token cookie with a newly rotated refresh token.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshSuccessResponse"

        "401":
          description: Refresh request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              examples:
                missingRefreshToken:
                  summary: Refresh token missing
                  value:
                    success: false
                    code: REFRESH_TOKEN_MISSING
                    message: Refresh token is missing

                invalidRefreshToken:
                  summary: Invalid refresh token
                  value:
                    success: false
                    code: REFRESH_TOKEN_INVALID
                    message: Refresh token is invalid or expired

                sessionNotFound:
                  summary: Session not found
                  value:
                    success: false
                    code: SESSION_NOT_FOUND
                    message: Refresh session was not found

                sessionRevoked:
                  summary: Session revoked
                  value:
                    success: false
                    code: SESSION_REVOKED
                    message: Refresh session has been revoked

                idleTimeout:
                  summary: Idle timeout
                  value:
                    success: false
                    code: SESSION_IDLE_TIMEOUT
                    message: Refresh session expired due to inactivity

                absoluteTimeout:
                  summary: Absolute timeout
                  value:
                    success: false
                    code: SESSION_ABSOLUTE_TIMEOUT
                    message: Refresh session has expired

                tokenMismatch:
                  summary: Refresh token mismatch
                  value:
                    success: false
                    code: REFRESH_TOKEN_MISMATCH
                    message: Refresh token does not match the session

                tokenReuse:
                  summary: Refresh token reuse detected
                  value:
                    success: false
                    code: TOKEN_REUSE_DETECTED
                    message: Refresh token reuse was detected. Please log in again.

                userNotFound:
                  summary: User not found
                  value:
                    success: false
                    code: USER_NOT_FOUND
                    message: User was not found

        "409":
          description: Refresh-session rotation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                success: false
                code: SESSION_ROTATION_FAILED
                message: Refresh session could not be rotated

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericErrorResponse"

  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      tags:
        - Authentication
      summary: Logout current session
      description: >
        Revokes the current refresh session when a valid refresh-token cookie is present
        and clears the refresh_token cookie.
        This endpoint is intentionally idempotent, so calling logout when no active
        refresh cookie exists still returns a successful response.

      security:
        - refreshCookie: []

      responses:
        "200":
          description: Logout completed
          headers:
            Set-Cookie:
              description: Clears the refresh_token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccessResponse"
              examples:
                loggedOut:
                  summary: Active session revoked
                  value:
                    success: true
                    message: Logged out successfully

                alreadyLoggedOut:
                  summary: No active refresh cookie
                  value:
                    success: true
                    message: Already logged out

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericErrorResponse"

  /api/v1/auth/logout-all:
    post:
      operationId: logoutAllUsers
      tags:
        - Authentication
      summary: Logout all sessions
      description: >
        Validates the refresh token stored in the refresh_token HttpOnly cookie,
        identifies the related user session, revokes all active refresh sessions
        belonging to that user, and clears the current refresh-token cookie.
        If no refresh cookie is present, the endpoint returns a successful
        "Already logged out" response.

      security:
        - refreshCookie: []

      responses:
        "200":
          description: Logout-all completed
          headers:
            Set-Cookie:
              description: Clears the refresh_token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccessResponse"
              examples:
                allSessionsRevoked:
                  summary: All active sessions revoked
                  value:
                    success: true
                    message: All sessions revoked successfully

                alreadyLoggedOut:
                  summary: Refresh cookie missing
                  value:
                    success: true
                    message: Already logged out

        "401":
          description: Refresh session validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericErrorResponse"

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Authentication
      summary: Get current user
      description: >
        Returns the authenticated user's profile, assigned regions,
        assigned locations, and permissions.
        A valid access token must be provided in the Authorization header
        using the Bearer authentication scheme.

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Current user retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"

        "401":
          description: Access token missing, invalid, expired, or wrong token type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"

        "404":
          description: Authenticated user no longer exists or has been soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                success: false
                code: USER_NOT_FOUND
                message: User not found

        "500":
          description: Failed to fetch current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericErrorResponse"

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token sent in the Authorization header using:
        Bearer <access-token>.

    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: >
        HttpOnly refresh-token cookie used by refresh, logout, and logout-all endpoints.
        Browser JavaScript must not attempt to read this cookie directly.

  schemas:

    LoginSuccessResponse:
      type: object
      required:
        - success
        - message
        - access_token
        - expires_in
        - user
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login successful
        access_token:
          type: string
          description: JWT access token used in the Authorization header.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
          example: 1800
        user:
          $ref: "#/components/schemas/LoginUser"

    LoginUser:
      type: object
      required:
        - id
        - fullName
        - email
        - role_id
        - role_name
      properties:
        id:
          type: integer
          example: 2
        fullName:
          type: string
          example: Admin User
        email:
          type: string
          format: email
          example: user@example.com
        role_id:
          type: integer
          example: 1
        role_name:
          type: string
          example: Administrator

    RefreshSuccessResponse:
      type: object
      required:
        - success
        - message
        - access_token
        - expires_in
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: New access token generated
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
          example: 1800

    LogoutSuccessResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Logged out successfully

    CurrentUserResponse:
      type: object
      required:
        - success
        - user
        - assignedRegions
        - assignedLocations
        - permissions
      properties:
        success:
          type: boolean
          example: true

        user:
          type: object
          required:
            - id
            - user_name
            - email
            - role_id
          properties:
            id:
              type: integer
              example: 2
            user_name:
              type: string
              example: Admin User
            email:
              type: string
              format: email
              example: user@example.com
            role_id:
              type: integer
              example: 1

        assignedRegions:
          type: array
          items:
            type: object
            properties:
              region_id:
                type: integer
                example: 1
              region_name:
                type: string
                example: Western Region
          example: []

        assignedLocations:
          type: array
          items:
            type: string
          example: []

        permissions:
          type: array
          items:
            type: string
          example: []

    ValidationErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Username and password are required

    AuthErrorResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: INVALID_CREDENTIALS
        message:
          type: string
          example: Invalid username or password

    UnauthorizedResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Unauthorized

    GenericErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Internal server error
